name: iOS TestFlight - Talento Hulp

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "CFBundleShortVersionString (ej: 2.0.8)"
        required: false
        type: string
      build_number:
        description: "CFBundleVersion (ej: 30) - debe ser mayor al anterior"
        required: false
        type: string

jobs:
  build-and-upload:
    runs-on: macos-26
    env:
      BUNDLE_ID: com.hulp.talento
      APPLE_TEAM_ID: 7D2MKM79GM
      APPSTORE_ISSUER_ID: 85e32ae7-0d36-4a53-8710-d4b9ed2e2bc5
      APPSTORE_API_KEY_ID: R65HQK7Q6S

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Xcode instalados en el runner:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

          # App Store Connect rechaza binarios construidos con SDK < iOS 26.
          # Sin este guard el build corre 9 minutos completos y recien muere en
          # el upload con "Validation failed (409) SDK version issue".
          IOS_SDK_MAJOR=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -n 1)
          echo "iOS SDK mayor disponible: ${IOS_SDK_MAJOR:-desconocido}"
          if [ -z "$IOS_SDK_MAJOR" ] || [ "$IOS_SDK_MAJOR" -lt 26 ]; then
            echo "::error::App Store Connect exige iOS SDK 26+ (Xcode 26+). Detectado: ${IOS_SDK_MAJOR:-ninguno}"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Create environment file
        env:
          # En el repo de Usuarios, ENVIRONMENT_JSON es el de esa app.
          ENVIRONMENT_JSON: ${{ secrets.ENVIRONMENT_JSON_TALENTO || secrets.ENVIRONMENT_JSON }}
        run: |
          mkdir -p assets/environment_values
          echo "$ENVIRONMENT_JSON" > assets/environment_values/environment.json

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Setup signing assets
        env:
          IOS_DISTRIBUTION_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          # Este workflow tambien corre en el repo de Hulp Usuarios, donde
          # IOS_PROVISIONING_PROFILE_BASE64 es el perfil de com.hulp.hulp.
          # Por eso se prefiere el secret especifico de Talento. El chequeo de
          # application-identifier de mas abajo aborta si llega el equivocado.
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_TALENTO_BASE64 || secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app_store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          decode_base64() {
            if base64 --help 2>&1 | grep -q -- "--decode"; then
              base64 --decode
            else
              base64 -D
            fi
          }

          echo -n "$IOS_DISTRIBUTION_CERT_BASE64" | decode_base64 > "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | decode_base64 > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          # Verifica que el perfil sea el de ESTA app. Sin esto, un perfil de
          # otra app de la misma cuenta pasa los demas chequeos y el error solo
          # aparece al firmar, con un mensaje que no dice cual es el problema.
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::El provisioning es de '$PROFILE_APP_ID' y se esperaba '$APPLE_TEAM_ID.$BUNDLE_ID'."
            echo "Revisa el secret IOS_PROVISIONING_PROFILE_TALENTO_BASE64."
            exit 1
          fi
          echo "OK: el perfil corresponde a $PROFILE_APP_ID"

          # Verifica que el perfil traiga la capability de Sign in with Apple.
          # Sin esto compila igual pero el boton de Apple falla en el dispositivo.
          if /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" "$PROFILE_PLIST" >/dev/null 2>&1; then
            echo "OK: el provisioning profile incluye Sign in with Apple."
          else
            echo "ERROR: el provisioning profile NO incluye 'com.apple.developer.applesignin'."
            echo "Habilita la capability en el App ID $BUNDLE_ID, regenera el perfil"
            echo "y actualiza el secret IOS_PROVISIONING_PROFILE_BASE64."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          {
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_PLIST=$PROFILE_PLIST"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Setup App Store Connect API Key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          echo -n "$APPSTORE_API_PRIVATE_KEY" > "$API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Add Push Notifications entitlement
        run: |
          set -euo pipefail
          ENTITLEMENTS_PATH="ios/Runner/Runner.entitlements"

          # El archivo ya existe en el repo con Sign in with Apple: aqui solo se
          # AGREGA aps-environment. Nunca sobrescribir, o se pierde applesignin.
          if [ ! -f "$ENTITLEMENTS_PATH" ]; then
            echo "ERROR: falta $ENTITLEMENTS_PATH (deberia estar versionado)."
            exit 1
          fi

          # Solo se agrega si el provisioning profile AUTORIZA la capability.
          # Firmar con un entitlement que el perfil no incluye hace fallar el
          # build entero con "doesn't include the aps-environment entitlement".
          # El perfil actual (talentohul_appstore, 2026-08-12) NO trae Push:
          # el App ID no tiene esa capability habilitada. Cuando se habilite y
          # se regenere el perfil, este paso empieza a aplicarlo solo.
          if /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$PROFILE_PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string production" "$ENTITLEMENTS_PATH" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$ENTITLEMENTS_PATH"
            echo "OK: aps-environment agregado (el perfil lo autoriza)."
          else
            echo "AVISO: el provisioning profile no incluye aps-environment."
            echo "Se compila SIN push notifications. OneSignal no recibira en iOS."
            echo "Para habilitarlo: App ID $BUNDLE_ID -> capability Push Notifications,"
            echo "regenerar el perfil y actualizar IOS_PROVISIONING_PROFILE_BASE64."
          fi

          echo "Entitlements finales:"
          /usr/libexec/PlistBuddy -c "Print" "$ENTITLEMENTS_PATH"

      - name: Configure Flutter for release
        run: flutter build ios --config-only --release --no-codesign

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Set build name and number
        run: |
          BUILD_NAME="${{ github.event.inputs.build_name }}"
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"

          if [[ -n "$BUILD_NAME" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $BUILD_NAME" ios/Runner/Info.plist
          fi
          if [[ -n "$BUILD_NUMBER" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Runner/Info.plist
          fi

      - name: Create export options
        run: |
          set -euo pipefail
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          echo "EXPORT_OPTIONS_PATH=$EXPORT_OPTIONS_PATH" >> "$GITHUB_ENV"

      - name: Archive with xcodebuild
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=Apple Distribution" \
            "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyPath "$API_KEY_PATH"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Verify Sign in with Apple entitlement in binary
        run: |
          set -euo pipefail
          APP_PATH="$ARCHIVE_PATH/Products/Applications/Runner.app"
          echo "Entitlements embebidos en el binario firmado:"
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true

          if codesign -d --entitlements :- "$APP_PATH" 2>/dev/null | grep -q "com.apple.developer.applesignin"; then
            echo "OK: Sign in with Apple quedo firmado en la app."
          else
            echo "ERROR: la app se firmo SIN Sign in with Apple."
            echo "Revisa CODE_SIGN_ENTITLEMENTS en ios/Runner.xcodeproj/project.pbxproj."
            exit 1
          fi

      - name: Export IPA
        run: |
          set -euo pipefail
          IPA_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_DIR"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$IPA_DIR" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" \
            -authenticationKeyPath "$API_KEY_PATH"

          IPA_PATH=$(find "$IPA_DIR" -maxdepth 1 -name "*.ipa" | head -n 1)
          if [[ -z "$IPA_PATH" ]]; then
            echo "No se encontro IPA en $IPA_DIR"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ env.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ env.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
