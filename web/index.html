<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hulp">

  

  <meta name="robots" content="noindex" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Hulp" />
  <meta property="og:description" content="Built with FlutterFlow." />
  <meta property="og:image" content="/assets/assets/images/Union_(1).svg" /> 
  <meta name="twitter:title" content="Hulp" />
  <meta name="twitter:description" content="Built with FlutterFlow." />
  <meta name="twitter:image" content="/assets/assets/images/Union_(1).svg" />
  <meta name="twitter:card" content="summary_large_image" />

  <title> Hulp </title>
  <meta name="description" content="Built with FlutterFlow." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#f1f4f8">

  <link rel="manifest" href="manifest.json">
  
  <!-- Maps para google_maps_flutter_web. En web la clave es publica
       por definicion: lo que la protege es la restriccion por
       referente HTTP en Google Cloud. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC8Ft4iCpxcoo8WmzpCo9Y5gcRKOeDKaiA&loading=async"></script>
</head>
<body>
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
